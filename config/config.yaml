  - spot_symbol:   "ETH/USDT"
    perp_symbol:   "ETH/USDT:USDT"
    spot_exchange:  "binance_spot"
    perp_exchange:  "binance"
    active: false              # enable after paper testing basis strategy
    min_basis_entry: 0.0010    # 0.10% premium → enter
    min_basis_exit:  0.0002    # 0.02% → exit

  - spot_symbol:   "SOL/USDT"
    perp_symbol:   "SOL/USDT:USDT"
    spot_exchange:  "binance_spot"
    perp_exchange:  "binance"
    active: false
    min_basis_entry: 0.0010
    min_basis_exit:  0.0002

