    min_basis_exit:  0.0002

# ── Strategy Parameters ───────────────────────────────────────
strategy:
  # ── Entry / Exit ───────────────────────────────────────────────────────────
  # Break-even math: entry - exit > round_trip_fee + real-world slippage
  # Fee = 0.08% round-trip. Slippage in live ~0.28-0.35% per trade.
  # At 0.11% floor: avg gross $2.13 - $2.00 fee - $0.28 slip = -$0.15/trade (loses in live)
  # At 0.18% floor: avg gross $3.40 - $2.00 fee - $0.30 slip = +$1.10/trade (profitable in live)
  # Raised from 0.0011 → 0.0018 on 2026-04-23 to eliminate marginal 7x trades.
  # Impact: ~50% fewer trades, ~65-70% of paper profit captured in live vs 50% before.
  # 2026-05-06 paper data (50 trades) showed bucket economics:
  #   0.30-0.40%: 75% WR, $1.80 avg — eaten by ~$5 live execution cost
  #   0.40-0.50%: 86% WR, $5.26 avg — SWEET SPOT, profitable in live
  #   0.50-0.70%: 53% WR, $1.67 avg — overshoot tail risk
  #   >=0.70%   : 75% WR, $3.30 avg — decent
  # Raising floor to 0.40% skips the unprofitable bucket. Market-order entry
  # (below) eliminates orphan tail risk that paper doesn't model.
  min_spread_entry: 0.0080      # 0.80% — at $349 capital, friction is ~0.40% of notional
                                # so need entry >0.80% with capture_ratio 0.5 to net positive
  min_spread_exit: 0.0001       # 0.01% — capture full compression
  paper_min_spread_entry: 0.0030  # paper has no execution cost — keep wide collection
  paper_min_spread_exit: 0.0001

  # ── REALIZED-P&L EXIT (new 2026-05-07) ──────────────────────────────────
  # Old logic compared raw exit_spread to a 0.01% threshold. Because
  # exit_spread is structurally negative due to bid-ask offset, that fired
  # immediately on every trade. New logic uses realized round-trip return
  # (entry_spread + current_exit_spread) which correctly measures captured P&L.
  profit_capture_ratio: 0.5     # exit when realized >= 50% of entry spread
                                # e.g. entered at 0.50% → exit at +0.25% realized
                                # 0.7 = greedier, 0.3 = less greedy (faster exits)
  realized_stop_loss: -0.0040   # exit if realized round-trip drops below -0.40%
                                # protects against runaway adverse moves
  trailing_exit_buffer: 0.0010  # if max_realized was good but gave back this much, exit
                                # 0.10% giveback triggers trailing exit

  # Funding exit/entry window — only consider funding adverse if within
  # this many minutes of next 8h settlement. Prevents the bot from opening
  # then immediately closing trades when funding is irrelevant (next
  # settlement is hours away, trade will close on profit/stop long before).
  funding_exit_window_min: 30
  order_fill_timeout_seconds: 8      # parallel single-shot timeout; if not filled in 8s, cancel
  entry_aggressiveness_bps: 5        # cross spread by 5 bps each leg — guaranteed taker fill, single shot

  # entry_order_type: "limit" (default) | "market"
  # When the slow exchange consistently fails to fill limits in current regime
  # (e.g. WIF binance leg never filling while bybit always does), switch to
  # "market" to eliminate cancel-fill race orphans. Cost: ~0.05-0.10% extra
  # taker fees vs limit-with-cross. Benefit: both legs fill or neither does.
  entry_order_type: market

  # Circuit breaker: pause a pair if it generates too many orphan/imbalance
  # events in a short window. Prevents repeated bleeding when execution
  # structure on a pair has degraded.
  circuit_breaker:
    max_orphans: 3      # disable pair after this many orphans...
    window_min:  30     # ...within this many minutes
    pause_min:   60     # disable for this many minutes

  # ── Adaptive per-pair spread threshold ────────────────────────────────────
  # Each pair self-tunes its entry threshold based on live P&L results.
  # Losing trade  → threshold rises by step_up  (+0.10%) — needs wider spread to enter
  # Winning trade → threshold falls by step_down (-0.05%) — earns its way back
  # Ceiling (0.25%) acts as a soft-disable: pairs rarely have spreads that wide,
  # so a pair that keeps losing effectively stops trading until market conditions improve.
  # On bot restart, last `lookback` trades are replayed to restore each pair's threshold.
  adaptive_spread:
    enabled:   true
    step_up:   0.0005    # +0.05% per losing trade  — floor→ceiling needs 3 consecutive losses
    step_down: 0.0002    # -0.02% per profitable trade — ceiling→floor needs ~7 wins
    floor:     0.0040    # 0.40% — match new entry threshold (sweet-spot bucket)
    ceiling:   0.0060    # 0.60% — adaptive 20bp range for throttling losing pairs
    decay_per_hour: 0.0006  # 0.06%/h — pair recovers from ceiling to floor in ~2.5 hours
    lookback:  10        # trades to replay on restart (only clean notional-capped trades)

  # ── Scan speed ─────────────────────────────────────────────────────────────
  # 2026-05-07: dropped 10→3s. Exit lag was costing ~$1/trade — bot saw entry
  # spread at t=0, didn't re-check until t=10s by which time spread had already
  # overshot zero, eroding capture. 3s tick lets exit fire near convergence.
  # Trade-off: 3.3x more REST calls. Mitigation below: max_simultaneous=1 keeps
  # entry-eval narrow, and ws_cache (if enabled) eliminates most REST polls.
  position_check_interval: 3         # seconds — much faster reaction to spread collapse
  funding_window_minutes: 30
  funding_window_fast_interval: 3    # seconds — extra fast near funding settlements

  # ── Position limits ────────────────────────────────────────────────────────
  # Cap = capital / ~$400 per trade margin (both legs combined).
  # $400 → 1 concurrent | $951 → 2 | $1500 → 3 | $3000 → 6
  # Set conservatively; bybit margin warnings (>75%) mean you're over-allocated.
  max_simultaneous_positions: 1      # for $400 capital — raise as you scale up
  max_hold_hours: 12

  # ── Notional cap — CRITICAL ────────────────────────────────────────────────
  # Without this cap, when only 1 position is open the formula gives:
  # tradeable * 7 * 0.60 / 1 = way too large — fees eat everything.
  # Cap ensures no single trade risks more than this notional.
  # At $1k capital the formula naturally gives ~$800 (cap doesn't bind).
  # Cap starts binding at ~$3k capital — raise it as you scale:
  #   $1k–$3k  → $2,500 (formula binds before cap anyway)
  #   $3k–$7k  → $2,500 (formula reaches cap here — keep it)
  #   $7k–$15k → $5,000 (raise when profits justify larger per-trade size)
  #   $15k+    → $10,000
  max_notional_per_trade: 2500       # USD — hard cap per trade regardless of sizing formula

  # ── Re-entry cooldown ──────────────────────────────────────────────────────
  # After closing a position on a pair, wait this many seconds before re-entering.
  # Prevents the bot from immediately re-entering at the same price (FIL bug: 4 trades
  # at identical prices within 20 seconds).
  reentry_cooldown_seconds: 120      # 2 minutes between close and next entry on same pair

  # ── Exit refinements ───────────────────────────────────────────────────────
  trailing_exit_buffer: 0.0002       # 0.02% bounce-back before exit

  # ── Funding ────────────────────────────────────────────────────────────────
  funding_harvest_min_rate: 0.0001
  funding_harvest_entry_min_rate: 0.0003
  funding_harvest_deploy_pct: 0.30
  basis_size_pct: 0.20

# ── Per-exchange maker fee rates ──────────────────────────────
# Used to compute exact round-trip fee per trade and set correct entry threshold.
# Round-trip = (fee_a + fee_b) * 2  (open both legs + close both legs)
exchange_fees:
  binance:      0.00020          # 0.020% maker (0.018% with BNB fee discount)
  bybit:        0.00020          # 0.020% maker
  gate:         0.00015          # 0.015% maker — slightly cheaper than Bybit
  bitget:       0.00020          # 0.020% maker
  mexc:         0.00000          # 0.000% maker — MEXC perpetuals are free for makers
  okx:          0.00020          # 0.020% maker

# ── Position Sizing (dynamic) ─────────────────────────────────
position_sizing:
  high_spread_threshold: 0.002       # >= 0.20% → deploy 100%
  high_spread_deploy:    1.00        # 100% of available margin
  medium_spread_min:     0.0008      # 0.08% → deploy 60%
  medium_spread_deploy:  0.60        # 60%
  low_spread_deploy:     0.00        # 0% — sit flat in USDT
  post_drawdown_deploy:  0.40        # 40% for 72h after stop-loss trigger
  post_drawdown_hours:   72
  correlation_min:       0.85        # pause all trades below this
  correlation_lookback:  60          # minutes for rolling correlation

# ── Risk Management ───────────────────────────────────────────
risk:
  account_stop_loss_pct: 0.08        # 8% unrealised loss → close everything
  high_water_mark_floor: 0.15        # 15% drop from peak → halt bot
  max_margin_usage:      0.75        # never exceed 75% margin utilisation
  margin_alert_pct:      0.70        # 70% → send alert
  position_loss_alert:   0.05        # 5% unrealised loss on any position
  max_daily_loss:        50          # USD — base daily loss floor (5% of $1k capital)
                                    # SCALE WITH CAPITAL: $1k→$50 | $2.5k→$125 | $5k→$200 | $10k→$300
  daily_loss_profit_step: 100       # every $100 in daily profit → unlock $25 more loss allowance
  daily_loss_step_amount: 25        # USD added to limit per profit step
  # Effective limit examples (at $1k capital):
  #   profit $0   → max loss $50
  #   profit $100 → max loss $75
  #   profit $200 → max loss $100
  #   profit $300 → max loss $125
  atr_spike_threshold:   0.05        # 5% 24h ATR → halve position size
  news_blackout_minutes: 120         # 2 hours around macro events

# ── News Blackout Events ──────────────────────────────────────
# List upcoming FOMC / CPI / major crypto regulatory dates in UTC ISO format.
# Update this list monthly. Bot pauses news_blackout_minutes each side.
news_blackout_events: []
  # - "2026-05-07T18:00:00"   # FOMC May 2026
  # - "2026-06-11T12:30:00"   # CPI June 2026

# ── Profit Extraction ─────────────────────────────────────────
profit_extraction:
  weekly_withdrawal_pct:  0.35       # 35% of week net profit → cold wallet
  weekly_day: "friday"
  weekly_hour_awst: 18               # 18:00 AWST
  monthly_tax_pct:        0.25       # 25% → AUD fiat for tax (ATO)
  monthly_reinvest_pct:   0.40       # 40% → back into margin (compounds growth)
  monthly_liquidity_pct:  0.35       # 35% → USDT spot buffer
  cold_wallet_address_env: "COLD_WALLET_ADDRESS"

# ── Monitoring & Alerts ───────────────────────────────────────
alerts:
  # Telegram (FREE — recommended)
  # Setup: message @BotFather on Telegram → /newbot → copy token
  # Get chat_id: https://api.telegram.org/bot{TOKEN}/getUpdates (send any msg to bot first)
  telegram_token_env:   "TELEGRAM_BOT_TOKEN"   # env var name holding your bot token
  telegram_chat_id_env: "TELEGRAM_CHAT_ID"      # env var name holding your numeric chat ID

  # Twilio SMS (optional — paid)
  twilio_sid_env:       "TWILIO_ACCOUNT_SID"
  twilio_token_env:     "TWILIO_AUTH_TOKEN"
  twilio_from_env:      "TWILIO_FROM_NUMBER"
  alert_phone_env:      "ALERT_PHONE_NUMBER"

  # SMTP email (optional)
  alert_email_env:      "ALERT_EMAIL"
  smtp_host_env:        "SMTP_HOST"
  smtp_port_env:        "SMTP_PORT"
  smtp_user_env:        "SMTP_USER"
  smtp_pass_env:        "SMTP_PASS"

  inactivity_alert_hours: 4          # alert if no trades for 4h during market hours

# ── Reporting ─────────────────────────────────────────────────
reporting:
  monthly_target: 600                # USD — used for progress bar in Telegram reports

# ── Dashboard ─────────────────────────────────────────────────
dashboard:
  enabled: true
  host: "127.0.0.1"
  port: 5000
  debug: false

# ── Database ──────────────────────────────────────────────────
database:
  path: "data/bot.db"

# ── Logging ───────────────────────────────────────────────────
logging:
  level: "INFO"
  log_dir: "logs"
  max_bytes: 10485760     # 10 MB
  backup_count: 7
