# ============================================================
#  Delta-Neutral Bot — Configuration File
#  All sensitive values (API keys) come from environment vars.
#  Never commit API keys to this file.
# ============================================================

# ── Capital & Exchange ────────────────────────────────────────
capital:
  total_usdt: 400               # 2026-05-06: scaled down to $400 to validate edge
                                # (bot overrides at startup with real wallet equity)
  binance_allocation: 0.75      # 75% = $300 on Binance Futures
  bybit_allocation: 0.25        # 25% = $100 on Bybit Perp
                                # — bybit only needs $100 since it's the leg-B side
                                #   that always fills. Binance needs cushion for retries.
  stablecoin_reserve: 40        # 10% buffer of $400
  free_margin_buffer: 0.15      # Keep 15% undeployed

exchanges:
  binance:
    name: "binanceusdm"         # CCXT exchange ID for Binance Futures
    api_key_env: "BINANCE_API_KEY"
    api_secret_env: "BINANCE_API_SECRET"
    testnet: false
  bybit:
    name: "bybit"               # CCXT exchange ID for Bybit
    api_key_env: "BYBIT_API_KEY"
    api_secret_env: "BYBIT_API_SECRET"
    testnet: false
  okx:
    name: "myokx"               # CCXT exchange ID for OKX EEA (my.okx.com)
    api_key_env: "OKX_API_KEY"
    api_secret_env: "OKX_API_SECRET"
    api_passphrase_env: "OKX_PASSPHRASE"   # OKX requires a passphrase
    default_type: "swap"        # OKX perpetuals are "swap" not "future"
    testnet: false
  gate:
    name: "gate"                # CCXT exchange ID for Gate.io Futures
    api_key_env: "GATE_API_KEY"
    api_secret_env: "GATE_API_SECRET"
    default_type: "swap"        # Gate.io perpetuals are "swap"
    testnet: false
  bitget:
    name: "bitget"              # CCXT exchange ID for Bitget Futures
    api_key_env: "BITGET_API_KEY"
    api_secret_env: "BITGET_API_SECRET"
    default_type: "swap"        # Bitget perpetuals are "swap"
    testnet: false
  mexc:
    name: "mexc"                # CCXT exchange ID for MEXC Futures (0% maker fee)
    api_key_env: "MEXC_API_KEY"
    api_secret_env: "MEXC_API_SECRET"
    default_type: "swap"        # MEXC perpetuals are "swap"
    testnet: false
  binance_spot:
    name: "binance"             # Binance SPOT — used for basis trading (spot vs perp)
    api_key_env: "BINANCE_API_KEY"
    api_secret_env: "BINANCE_API_SECRET"
    default_type: "spot"
    testnet: false

# ── Leverage ──────────────────────────────────────────────────
leverage:
  default: 7                    # 7x — 0.11% to 0.20% spread
  medium_threshold: 0.0020      # 0.20% → step up to 8x
  medium_leverage: 8
  maximum: 10
  high_spread_threshold: 0.0030 # 0.30% → use 10x

