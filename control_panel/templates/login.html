<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control Panel — Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background: #0d1117; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { width: 100%; max-width: 380px; background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 2.5rem; }
    .brand { font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; color: #8b949e; margin-bottom: 0.25rem; }
    .title { font-size: 1.4rem; font-weight: 600; color: #e6edf3; margin-bottom: 2rem; }
    .instance-badge { display: inline-block; background: #1f6feb22; border: 1px solid #1f6feb; color: #58a6ff; border-radius: 20px; padding: 0.2rem 0.75rem; font-size: 0.75rem; margin-bottom: 1.5rem; }
    .form-control { background: #0d1117; border-color: #30363d; color: #e6edf3; }
    .form-control:focus { background: #0d1117; border-color: #1f6feb; color: #e6edf3; box-shadow: 0 0 0 3px rgba(31,111,235,.25); }
    .btn-primary { background: #1f6feb; border-color: #1f6feb; font-weight: 600; }
    .btn-primary:hover { background: #388bfd; border-color: #388bfd; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">Delta-Neutral Bot</div>
    <div class="title">Control Panel</div>
    <div class="instance-badge" id="instance-label">Loading…</div>
    <div id="error-msg" style="display:none" class="alert alert-danger py-2 small mb-3">Incorrect password</div>
    <form method="post">
      <div class="mb-3">
        <label class="form-label text-secondary small">Password</label>
        <input type="password" name="password" class="form-control" autofocus placeholder="Enter panel password">
      </div>
      <button type="submit" class="btn btn-primary w-100">Sign in</button>
    </form>
  </div>
  <script>
    // Load instance name from public endpoint
    fetch('/api/meta/public')
      .then(r => r.json())
      .then(d => { document.getElementById('instance-label').textContent = d.instance || 'Bot Control Panel'; })
      .catch(() => { document.getElementById('instance-label').textContent = 'Bot Control Panel'; });

    // Show error if redirected with ?error=1
    if (new URLSearchParams(window.location.search).get('error')) {
      document.getElementById('error-msg').style.display = 'block';
    }
  </script>
</body>
</html>
